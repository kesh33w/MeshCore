[env:private_observer_v4]
extends = env:heltec_v4_repeater_observer_mqtt
build_flags = ${env:heltec_v4_repeater_observer_mqtt.build_flags}
  -D PRIVATE_OBSERVER_BASE=1
  -D PRIVATE_TESTER_FULL_SETUP=1
  -D PRIVATE_INSTALL_IDENTITY=1
  -D PRIVATE_REMOTE_CAPTURE=1
  -D PRIVATE_BENCH_STARTUP=1
  -D MQTT_DEFAULT_IATA='"SMF"'
  -D MQTT_DEFAULT_SLOT1_PRESET='"sacmesh"'
  -D MQTT_DEFAULT_SLOT2_PRESET='"none"'
  -include examples/simple_repeater/ObserverBuild.h
board_build.flash_mode = dio

[env:kesh_v43_oled]
extends = env:private_observer_v4
extra_scripts =
  ${env:heltec_v4_repeater_observer_mqtt.extra_scripts}
  pre:scripts/private_tls12.py

[env:sacmesh_v43_tft]
extends = env:private_observer_v4
build_unflags =
  -D HELTEC_LORA_V4_OLED
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_OLED_RESET=21
build_flags = ${env:private_observer_v4.build_flags}
  -D HELTEC_LORA_V4_TFT
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D PIN_BOARD_SDA=4
  -D PIN_BOARD_SCL=3
  -D DISPLAY_SCALE_X=2.5
  -D DISPLAY_SCALE_Y=3.75
  -D PIN_TFT_RST=18
  -D PIN_TFT_VDD_CTL=-1
  -D PIN_TFT_LEDA_CTL=21
  -D PIN_TFT_LEDA_CTL_ACTIVE=HIGH
  -D PIN_TFT_CS=15
  -D PIN_TFT_DC=16
  -D PIN_TFT_SCL=17
  -D PIN_TFT_SDA=33
build_src_filter = ${env:heltec_v4_repeater_observer_mqtt.build_src_filter}
  -<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/ST7789LCDDisplay.cpp>
lib_deps = ${env:heltec_v4_repeater_observer_mqtt.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0

[env:sacmesh_v43_tft_touch_probe]
extends = env:sacmesh_v43_tft
build_flags = ${env:sacmesh_v43_tft.build_flags}
  -D TFT_TOUCH_PROBE=1

[env:sacmesh_v43_tft_touch]
extends = env:sacmesh_v43_tft
build_flags = ${env:sacmesh_v43_tft.build_flags}
  -D TFT_WIFI_SETUP=1

[env:sacmesh_v43_tft_touch_bench]
extends = env:sacmesh_v43_tft_touch
build_flags = ${env:sacmesh_v43_tft_touch.build_flags}
  -D TFT_WIFI_SETUP_BENCH=1
