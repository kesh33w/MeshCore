; Heltec WiFi LoRa 32 V3: 8 MB flash, no PSRAM, SSD1306 OLED.
; Copy this file to platformio.local.ini. Use an isolated PLATFORMIO_CORE_DIR
; because private_tls12.py verifies and patches the pinned Arduino TLS source.
[env:kesh_v3]
extends = env:Heltec_v3_repeater_observer_mqtt
extra_scripts =
  ${env:Heltec_v3_repeater_observer_mqtt.extra_scripts}
  pre:scripts/private_tls12.py
board_build.flash_mode = dio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_ssl_cert_source = adafruit-full
build_unflags =
  -D ESP32_CPU_FREQ=80
build_flags = ${env:Heltec_v3_repeater_observer_mqtt.build_flags}
  -D PRIVATE_OBSERVER_BASE=1
  -D PRIVATE_TESTER_FULL_SETUP=1
  -D PRIVATE_INSTALL_IDENTITY=1
  -D PRIVATE_REMOTE_CAPTURE=1
  -D PRIVATE_BENCH_STARTUP=1
  -D MQTT_DEFAULT_IATA='"SMF"'
  -D MQTT_DEFAULT_SLOT1_PRESET='"sacmesh"'
  -D MQTT_DEFAULT_SLOT2_PRESET='"none"'
  -include examples/simple_repeater/ObserverBuild.h
